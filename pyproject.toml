[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leakspot"
version = "0.1.0"
description = "Find data leakage in machine-learning code (static analysis) and in train/test data"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Md Shahinur Rahman" }]
requires-python = ">=3.10"
dependencies = [
  "click>=8.1",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]
keywords = ["data-leakage", "machine-learning", "static-analysis", "reproducibility",
            "jupyter", "scikit-learn", "linter"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
leakspot = "leakspot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["corpus"]
